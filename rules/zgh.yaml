  # GEMINATION
  # In-word gemminates are handled in-code when generating the
  # pronunciation dictionary. These rules are meant to 
  # integrate cross-word gemination. We allow a word to eat its
  # following word consonant. 
  #
  # The rule implementation here also covers for triplets:
  # endword_t + startword_tt  = /t.tt/ or /ttt/
  # startword_tt + endword_t = /tt.t/ or /ttt/
  # Since the triplet gets assigned as t: at the from of the 2nd word
  # NO info in the book for /tt+tt/ (can they be pronounced /tttt/???)
  #
  # According to "Syllables in tashlhiyt berber and in moroccan arabic"
  # assimilation is done according to the initial of the next word.
  # Therefore the beginning is where a long-consonant(gemination) may appear
  #
  - following_context: $ 
    preceding_context: ''
    replacement: ''
    segment: 'b'
  - following_context: ''
    preceding_context: ^
    replacement: 'b:'
    segment: 'b'
  - following_context: $
    preceding_context: ''
    replacement: ''
    segment: 'bʷ'
  - following_context: ''
    preceding_context: ^
    replacement: 'bʷ:'
    segment: 'bʷ'
  - following_context: $ 
    preceding_context: ''
    replacement: ''
    segment: 'm'
  - following_context: $ 
    preceding_context: ''
    replacement: ''
    segment: 'm:'
  - following_context: ''
    preceding_context: ^
    replacement: 'm:'
    segment: 'm'
