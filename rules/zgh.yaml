  # According to "Syllables in tashlhiyt berber and in moroccan arabic" p.156 
  # "tt t" or "t tt" may be realized as /tt + t/ or /ttt/
  # this happens for d,m and k as well.

#@article{ridouane2010geminates,
#  title={Geminates at the junction of phonetics and phonology},
#  author={Ridouane, Rachid},
#  journal={Laboratory phonology},
#  volume={10},
#  pages={61--90},
#  year={2010},
#  publisher={Mouton de Gruyter Berlin}
#}
# This article mentions that velars may be realized as palatals
# Before /i/
# Then the autor cite himself in a French paper
#
#@article{ridouane1999spirantisation,
#  title={La spirantisation dans un parler berb{\`e}re du Maroc (parler chleuh de Haha)},
#  author={Ridouane, Rachid},
#  journal={Dipl{\^o}me d’Etudes Approfondies, Universit{\'e} Paris},
#  volume={3},
#  year={1999}
#}
#
#
#However in the first page of "Syllables in tashlhiyt berber and in moroccan arabic"
# it says "Prevocalic voiceless stops are unaspirated"
#
#

  #  -  t in nt is never spirantized
  #  - gemminates(tense in the book)  never spirantized
  #  "Syllables in tashlhiyt berber and in moroccan arabic" p.190-193
  #  y between consonants becomes i
  #  w between consonants becomes u
  #  i with adjacent vowel becomes y
  #  u with adjacent vowel becomes w
  #  a(end) + a(begin) = /aa/(long a)
  - following_context: $
    preceding_context: '(w|j|b|bʷ|m|mʷ|f|n|s|sʷ|z|zʷ|t|tʷ|d|dʷ|l|r|rʷ|ʃ|ʒ|g|gʷ|k|kʷ|χ|χʷ|ʁ|ʁʷ|q|qʷ|ħ|ʕ)'
    replacement: 'i'
    segment: 'j'
  - following_context: '(w|j|b|bʷ|m|mʷ|f|n|s|sʷ|z|zʷ|t|tʷ|d|dʷ|l|r|rʷ|ʃ|ʒ|g|gʷ|k|kʷ|χ|χʷ|ʁ|ʁʷ|q|qʷ|ħ|ʕ)'
    preceding_context: ^
    replacement: 'i'
    segment: 'j'
  - following_context: $
    preceding_context: ''
    replacement: 'j'
    segment: 'i'
  - following_context: ''
    preceding_context: ^
    replacement: 'j'
    segment: 'i'
  - following_context: $
    preceding_context: '(w|j|b|bʷ|m|mʷ|f|n|s|sʷ|z|zʷ|t|tʷ|d|dʷ|l|r|rʷ|ʃ|ʒ|g|gʷ|k|kʷ|χ|χʷ|ʁ|ʁʷ|q|qʷ|ħ|ʕ)'
    replacement: 'u'
    segment: 'w'
  - following_context: '(w|j|b|bʷ|m|mʷ|f|n|s|sʷ|z|zʷ|t|tʷ|d|dʷ|l|r|rʷ|ʃ|ʒ|g|gʷ|k|kʷ|χ|χʷ|ʁ|ʁʷ|q|qʷ|ħ|ʕ)'
    preceding_context: ^
    replacement: 'u'
    segment: 'w'
  - following_context: $
    preceding_context: ''
    replacement: 'w'
    segment: 'u'
  - following_context: ''
    preceding_context: ^
    replacement: 'w'
    segment: 'u'
  - following_context: $
    preceding_context: ''
    replacement: ''
    segment: 'a'
  - following_context: ''
    preceding_context: ^
    replacement: 'a:'
    segment: 'a'



