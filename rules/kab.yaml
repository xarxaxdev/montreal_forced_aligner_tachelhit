rules:
  #  - following_context: $ #end of word
  #    preceding_context: ''
  #    replacement: ''
  #    segment: 's'
  #  - following_context: '[^aiouejw]' #middle of the word not followed by vowel or glide
  #    preceding_context: ''
  #    replacement: 'h'
  #    segment: 's'
  #    GEMMINATES
  - following_context: ''
    preceding_context: ''
    replacement: 't:'
    segment: 't t'
  #    https://books.google.de/books?hl=en&lr=&id=T6jmziooEk0C&oi=fnd&pg=PA461&dq=spirantization+in+berber&ots=ffGLmlWXW_&sig=gfaXvI9lnrlMUYpTa9dYtADLZPI&redir_esc=y#v=onepage&q=spirantization%20in%20berberspiran&f=false 
  #  -  t in nt is never spirantized
  #  - gemminates(tense in the book)  never spirantized
  - following_context: '[^aiouejw]'
    preceding_context: '^'
    replacement: 'e s'
    segment: 's'
  - following_context: '[^aiouejw]'
    preceding_context: '^'
    replacement: 'e z'
    segment: 'z'
  - following_context: ''
    preceding_context: '^'
    replacement: ''
    segment: 'x'
  - following_context: '$'
    preceding_context: ''
    replacement: ''
    segment: 'ɾ'
  - following_context: '$'
    preceding_context: ''
    replacement: 'r'
    segment: 'ɾ'
  - following_context: '$'
    preceding_context: ''
    replacement: ''
    segment: '[ŋnmɲ]'
  - following_context: '$'
    preceding_context: ''
    replacement: ''
    segment: 'ð'

  - following_context: '[^aiouejw]'
    preceding_context: '[aiouejw]'
    replacement: 'r'
    segment: 'ɾ'
  - following_context: '[aiouejw]'
    preceding_context: '[^aiouejw]'
    replacement: 'r'
    segment: 'ɾ'
